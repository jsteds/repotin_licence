<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan ke Repotin License Manager...</title>
  <script>
    // Jika ada typo ejaan seperti 'license' atau subpath yang salah, arahkan langsung ke root companion
    var path = window.location.pathname;
    if (path.indexOf("repotin_") !== -1) {
      window.location.replace("https://jsteds.github.io/repotin_licence/");
    } else {
      setTimeout(function() {
        window.location.replace("https://jsteds.github.io/repotin_licence/");
      }, 1000);
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      border: 1px solid #27272a;
      background: #18181b;
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 16px;
      background: #fafafa;
      color: #09090b;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="font-size: 16px; margin-bottom: 8px;">Mengarahkan Halaman...</h2>
    <p style="font-size: 12px; color: #a1a1aa; margin: 0;">Sedang mengalihkan ke Repotin License Manager resmi.</p>
    <a href="https://jsteds.github.io/repotin_licence/">Buka Sekarang</a>
  </div>
</body>
</html>
